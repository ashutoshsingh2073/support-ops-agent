services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 3000
    restart: unless-stopped

